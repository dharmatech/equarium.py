<svg xmlns="http://www.w3.org/2000/svg" width="760" height="656" viewBox="0 0 760 656" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15">
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#24292f"/></marker><marker id="arrow-known" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1a7f37"/></marker><marker id="arrow-want" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#cf222e"/></marker><marker id="arrow-unknown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6e7781"/></marker></defs>
<rect width="760" height="656" fill="#ffffff"/>
<g transform="translate(0,0)">
<text x="20" y="30" fill="#24292f" text-anchor="start" font-size="16" font-weight="bold" font-style="normal">Example 2.4 (a): where is he, and how fast, at t = 2.0 s?</text>
<line x1="40" y1="205" x2="710" y2="205" stroke="#24292f" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<line x1="70" y1="197" x2="70" y2="213" stroke="#24292f" stroke-width="1.5"/>
<text x="70" y="233" fill="#24292f" text-anchor="middle" font-size="15" font-weight="normal" font-style="normal">O</text>
<text x="718" y="210" fill="#24292f" text-anchor="start" font-size="17" font-weight="normal" font-style="italic">x</text>
<path d="M 210.0 155 Q 425.0 85 640.0 155" fill="none" stroke="#24292f" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<text x="425.0" y="104" fill="#6e7781" text-anchor="middle">v<tspan dy="5" font-size="11">av-x</tspan></text>
<text x="425.0" y="83" fill="#1a7f37" text-anchor="middle">a<tspan dy="5" font-size="11">x</tspan><tspan dy="-5"> = 4 m/s²</tspan></text>
<text x="425.0" y="62" fill="#6e7781" text-anchor="middle">Δt</text>
<line x1="200.0" y1="181" x2="252.0" y2="181" stroke="#1a7f37" stroke-width="2.5" marker-end="url(#arrow-known)"/>
<circle cx="200.0" cy="205" r="6" fill="#24292f"/>
<text x="200.0" y="231" fill="#6e7781" text-anchor="middle" font-size="13" font-weight="normal" font-style="italic">state 0</text>
<text x="200.0" y="255" fill="#1a7f37" text-anchor="middle">t<tspan dy="5" font-size="11">0</tspan><tspan dy="-5"> = 0</tspan></text>
<text x="200.0" y="276" fill="#1a7f37" text-anchor="middle">x<tspan dy="5" font-size="11">0</tspan><tspan dy="-5"> = 5 m</tspan></text>
<text x="200.0" y="297" fill="#1a7f37" text-anchor="middle">v<tspan dy="5" font-size="11">0x</tspan><tspan dy="-5"> = 15 m/s</tspan></text>
<line x1="650.0" y1="181" x2="702.0" y2="181" stroke="#cf222e" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#arrow-want)"/>
<circle cx="650.0" cy="205" r="6" fill="#24292f"/>
<text x="650.0" y="231" fill="#6e7781" text-anchor="middle" font-size="13" font-weight="normal" font-style="italic">state 1</text>
<text x="650.0" y="255" fill="#1a7f37" text-anchor="middle">t<tspan dy="5" font-size="11">1</tspan><tspan dy="-5"> = 2 s</tspan></text>
<text x="650.0" y="276" fill="#cf222e" text-anchor="middle">x<tspan dy="5" font-size="11">1</tspan><tspan dy="-5"> = ?</tspan></text>
<text x="650.0" y="297" fill="#cf222e" text-anchor="middle">v<tspan dy="5" font-size="11">1x</tspan><tspan dy="-5"> = ?</tspan></text>
</g>
<line x1="20" y1="310" x2="740" y2="310" stroke="#d0d7de" stroke-width="1"/>
<g transform="translate(0,310)">
<text x="20" y="30" fill="#24292f" text-anchor="start" font-size="16" font-weight="bold" font-style="normal">Example 2.4 (b): where is he when his speed is 25 m/s?</text>
<line x1="40" y1="205" x2="710" y2="205" stroke="#24292f" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<line x1="70" y1="197" x2="70" y2="213" stroke="#24292f" stroke-width="1.5"/>
<text x="70" y="233" fill="#24292f" text-anchor="middle" font-size="15" font-weight="normal" font-style="normal">O</text>
<text x="718" y="210" fill="#24292f" text-anchor="start" font-size="17" font-weight="normal" font-style="italic">x</text>
<path d="M 210.0 155 Q 425.0 85 640.0 155" fill="none" stroke="#24292f" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<text x="425.0" y="104" fill="#6e7781" text-anchor="middle">v<tspan dy="5" font-size="11">av-x</tspan></text>
<text x="425.0" y="83" fill="#1a7f37" text-anchor="middle">a<tspan dy="5" font-size="11">x</tspan><tspan dy="-5"> = 4 m/s²</tspan></text>
<text x="425.0" y="62" fill="#6e7781" text-anchor="middle">Δt</text>
<line x1="200.0" y1="181" x2="252.0" y2="181" stroke="#1a7f37" stroke-width="2.5" marker-end="url(#arrow-known)"/>
<circle cx="200.0" cy="205" r="6" fill="#24292f"/>
<text x="200.0" y="231" fill="#6e7781" text-anchor="middle" font-size="13" font-weight="normal" font-style="italic">state 0</text>
<text x="200.0" y="255" fill="#1a7f37" text-anchor="middle">t<tspan dy="5" font-size="11">0</tspan><tspan dy="-5"> = 0</tspan></text>
<text x="200.0" y="276" fill="#1a7f37" text-anchor="middle">x<tspan dy="5" font-size="11">0</tspan><tspan dy="-5"> = 5 m</tspan></text>
<text x="200.0" y="297" fill="#1a7f37" text-anchor="middle">v<tspan dy="5" font-size="11">0x</tspan><tspan dy="-5"> = 15 m/s</tspan></text>
<line x1="650.0" y1="181" x2="702.0" y2="181" stroke="#1a7f37" stroke-width="2.5" marker-end="url(#arrow-known)"/>
<circle cx="650.0" cy="205" r="6" fill="#24292f"/>
<text x="650.0" y="231" fill="#6e7781" text-anchor="middle" font-size="13" font-weight="normal" font-style="italic">state 1</text>
<text x="650.0" y="255" fill="#6e7781" text-anchor="middle">t<tspan dy="5" font-size="11">1</tspan></text>
<text x="650.0" y="276" fill="#cf222e" text-anchor="middle">x<tspan dy="5" font-size="11">1</tspan><tspan dy="-5"> = ?</tspan></text>
<text x="650.0" y="297" fill="#1a7f37" text-anchor="middle">v<tspan dy="5" font-size="11">1x</tspan><tspan dy="-5"> = 25 m/s</tspan></text>
</g>
<g transform="translate(0,642)">
<rect x="20" y="-10" width="10" height="10" fill="#1a7f37"/>
<text x="35" y="0" fill="#1a7f37" text-anchor="start" font-size="12" font-weight="normal" font-style="normal">known</text>
<rect x="115" y="-10" width="10" height="10" fill="#cf222e"/>
<text x="130" y="0" fill="#cf222e" text-anchor="start" font-size="12" font-weight="normal" font-style="normal">want = ?</text>
<rect x="210" y="-10" width="10" height="10" fill="#6e7781"/>
<text x="225" y="0" fill="#6e7781" text-anchor="start" font-size="12" font-weight="normal" font-style="normal">unknown</text>
<text x="740" y="0" fill="#6e7781" text-anchor="end" font-size="12" font-weight="normal" font-style="italic">schematic, not to scale</text>
</g>
</svg>
